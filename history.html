<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Search History — FieldFix AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f6f7;color:#1a1a1a;}
#hdr{background:#fff;border-bottom:3px solid #e65c00;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,0.07);}
#hdr-left{display:flex;align-items:center;gap:10px;}
#hdr-icon{width:34px;height:34px;background:#e65c00;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;}
#hdr-title{font-size:15px;font-weight:800;}
#hdr-sub{font-size:9px;color:#999;}
.back-btn{background:#f0f0f0;border:1px solid #ddd;color:#666;border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:none;}
#content{max-width:700px;margin:0 auto;padding:24px 16px;}
#page-title{font-size:20px;font-weight:800;margin-bottom:4px;}
#page-sub{font-size:13px;color:#888;margin-bottom:24px;}
.history-card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all 0.15s;}
.history-card:hover{border-color:#e65c00;box-shadow:0 2px 8px rgba(230,92,0,0.1);}
.history-cat{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#e65c00;margin-bottom:6px;}
.history-q{font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:8px;line-height:1.4;}
.history-a{font-size:11px;color:#888;line-height:1.5;max-height:60px;overflow:hidden;}
.history-time{font-size:10px;color:#bbb;margin-top:8px;}
.history-divider{height:1px;background:#f0f0f0;margin:8px 0;}
#empty-state{text-align:center;padding:60px 20px;}
#empty-icon{font-size:48px;margin-bottom:16px;opacity:0.3;}
#empty-title{font-size:18px;font-weight:700;margin-bottom:8px;color:#555;}
#empty-sub{font-size:13px;color:#aaa;}
#loading{text-align:center;padding:40px;font-size:13px;color:#888;}
.clear-btn{background:none;border:1px solid #ffb8b8;color:#cc0000;border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;}
#header-actions{display:flex;align-items:center;gap:10px;}
.step{display:flex;gap:8px;margin:4px 0;align-items:flex-start;}
.snum{background:#f0f0f0;color:#333;font-weight:700;min-width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;}
.bul{margin:2px 0;padding-left:4px;color:#555;}
p{margin:3px 0;}
strong{font-weight:700;color:#1a1a1a;}
</style>
</head>
<body>
<div id="hdr">
  <div id="hdr-left">
    <div id="hdr-icon">🕐</div>
    <div><div id="hdr-title">Search History</div><div id="hdr-sub">Your recent troubleshooting sessions</div></div>
  </div>
  <div id="header-actions">
    <button class="clear-btn" onclick="clearAll()">Clear All</button>
    <a href="/app" class="back-btn">← Back to App</a>
  </div>
</div>

<div id="content">
  <div id="loading">Loading your history...</div>
  <div id="history-container" style="display:none;"></div>
  <div id="empty-state" style="display:none;">
    <div id="empty-icon">🔍</div>
    <div id="empty-title">No history yet</div>
    <div id="empty-sub">Your troubleshooting sessions will appear here after you use the app.</div>
  </div>
</div>

<script>
const token = localStorage.getItem('ff_tok');

function fmt(text){
  let f = text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  f = f.replace(/^(\d+)\.\s(.+)/gm,'<div class="step"><span class="snum">$1</span><span>$2</span></div>');
  f = f.replace(/^[-•]\s(.+)/gm,'<div class="bul">• $1</div>');
  f = f.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br/>');
  return '<p>'+f+'</p>';
}

async function loadHistory(){
  if(!token){ window.location.href='/app'; return; }
  try{
    const r = await fetch('/api/history', {headers:{'Authorization':'Bearer '+token}});
    if(r.status === 401){ window.location.href='/app'; return; }
    const d = await r.json();
    document.getElementById('loading').style.display='none';

    if(!d.history || d.history.length === 0){
      document.getElementById('empty-state').style.display='block';
      return;
    }

    const container = document.getElementById('history-container');
    container.style.display='block';
    container.innerHTML='';

    d.history.forEach(h => {
      const card = document.createElement('div');
      card.className='history-card';
      const time = new Date(h.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
      const question = h.question.replace(/^Current category:.*?\.\s*/,'').trim();
      const answer = h.answer.replace(/<[^>]*>/g,'').substring(0,120)+'...';
      card.innerHTML = `
        <div class="history-cat">${h.category.replace(/-/g,' ')}</div>
        <div class="history-q">${question}</div>
        <div class="history-divider"></div>
        <div class="history-a">${answer}</div>
        <div class="history-time">${time}</div>
      `;
      card.onclick = () => showDetail(h);
      container.appendChild(card);
    });
  }catch(e){
    document.getElementById('loading').textContent='Error loading history. Please try again.';
  }
}

function showDetail(h){
  const question = h.question.replace(/^Current category:.*?\.\s*/,'').trim();
  const container = document.getElementById('history-container');
  container.innerHTML = `
    <div style="margin-bottom:16px;">
      <button onclick="loadHistory()" class="back-btn">← Back to History</button>
    </div>
    <div style="background:#fff;border:1px solid #e5e5e5;border-radius:12px;overflow:hidden;">
      <div style="padding:16px;border-bottom:1px solid #f0f0f0;">
        <div style="font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#e65c00;margin-bottom:6px;">${h.category.replace(/-/g,' ')}</div>
        <div style="font-size:14px;font-weight:700;">${question}</div>
      </div>
      <div style="padding:16px;font-size:13px;line-height:1.75;color:#1a1a1a;">${fmt(h.answer)}</div>
    </div>
    <div style="margin-top:16px;text-align:center;">
      <a href="/app" style="background:#e65c00;color:#fff;padding:10px 24px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:700;">Continue Troubleshooting →</a>
    </div>
  `;
}

async function clearAll(){
  if(!confirm('Clear all search history? This cannot be undone.')) return;
  try{
    const r = await fetch('/api/history',{headers:{'Authorization':'Bearer '+token}});
    const d = await r.json();
    for(const h of (d.history||[])){
      await fetch('/api/history/'+h.id,{method:'DELETE',headers:{'Authorization':'Bearer '+token}});
    }
    loadHistory();
  }catch(e){ alert('Error clearing history'); }
}

loadHistory();
</script>
</body>
</html>
